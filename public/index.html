<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Scraper Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg-color:#0f172a;--text-main:#f8fafc;--text-muted:#94a3b8;--card-bg:rgba(30,41,59,.7);--card-border:rgba(255,255,255,.1);--primary:#3b82f6;--primary-hover:#2563eb;--accent:#10b981}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background-color:var(--bg-color);background-image:radial-gradient(at 0% 0%,rgba(59,130,246,.15) 0,transparent 50%),radial-gradient(at 100% 100%,rgba(16,185,129,.1) 0,transparent 50%);background-attachment:fixed;color:var(--text-main);min-height:100vh}body.modal-open{overflow:hidden}.container{max-width:1200px;margin:0 auto;padding:2rem}header{text-align:center;margin-bottom:2rem}h1{font-size:2.5rem;font-weight:700;margin:0 0 .5rem;background:linear-gradient(to right,#60a5fa,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.subtitle{color:var(--text-muted);font-size:1.05rem;margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin:1.5rem 0}.stat,.breakdown-card{background:var(--card-bg);border:1px solid var(--card-border);backdrop-filter:blur(12px);border-radius:.75rem;padding:1rem}.stat span,.breakdown-card span{color:var(--text-muted);font-size:.85rem;display:block}.stat strong{font-size:1.8rem;color:#6ee7b7;display:block;margin-top:.2rem}.controls{display:flex;gap:1rem;margin-bottom:2rem;flex-wrap:wrap;justify-content:center}input,select,button,.button{appearance:none;background-color:rgba(15,23,42,.8);color:var(--text-main);border:1px solid var(--card-border);padding:.75rem 1rem;border-radius:.5rem;font:inherit;backdrop-filter:blur(10px);outline:0}input[type=search]{min-width:260px}select:hover,select:focus,input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(59,130,246,.2)}button,.button{cursor:pointer;text-decoration:none;font-weight:600}.apply-filter{background:var(--primary);border-color:var(--primary)}.apply-filter:hover,.apply-btn:hover{background:var(--primary-hover)}.quick-link{display:grid;place-items:center}.summary-title{font-size:1.15rem;margin:0 0 .4rem}.summary-note{color:var(--text-muted);margin:0 0 .8rem}.breakdown{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.75rem;margin-bottom:2rem}.breakdown-card strong{display:block;margin:.25rem 0}.breakdown-card b{color:#6ee7b7}.job-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.5rem}.job-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:1rem;padding:1.5rem;backdrop-filter:blur(12px);transition:all .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;cursor:pointer}.job-card:hover{transform:translateY(-5px);box-shadow:0 10px 25px -5px rgba(0,0,0,.3);border-color:rgba(59,130,246,.4)}.job-header{display:flex;gap:1rem;margin-bottom:1rem;align-items:flex-start}.company-logo{width:48px;height:48px;border-radius:.5rem;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}.company-logo img{width:100%;height:100%;object-fit:contain}.fallback{font-weight:600;font-size:1.2rem;color:var(--text-muted)}.job-title-wrapper{flex:1}.job-title{font-size:1.15rem;font-weight:600;margin:0 0 .25rem;line-height:1.3}.company-name{font-size:.9rem;color:var(--text-muted);margin:0}.meta-tags{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}.tag{font-size:.75rem;padding:.25rem .6rem;border-radius:9999px;background:rgba(255,255,255,.05);color:#cbd5e1;border:1px solid rgba(255,255,255,.1)}.tag.source{background:rgba(59,130,246,.1);color:#93c5fd;border-color:rgba(59,130,246,.2)}.tag.salary{background:rgba(16,185,129,.1);color:#6ee7b7;border-color:rgba(16,185,129,.2)}.tag.skill{background:rgba(139,92,246,.1);color:#c4b5fd;border-color:rgba(139,92,246,.2)}.job-details{flex:1;font-size:.85rem;color:var(--text-muted);margin-bottom:1.5rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.apply-btn{display:block;width:100%;padding:.75rem;text-align:center;background:var(--primary);color:white;text-decoration:none;border:0;border-radius:.5rem;font-weight:600;cursor:pointer}.empty,.error{grid-column:1/-1;text-align:center;padding:3rem;color:var(--text-muted);background:var(--card-bg);border:1px solid var(--card-border);border-radius:1rem}.error{color:#fecaca}.pagination{display:flex;justify-content:space-between;align-items:center;margin:1.5rem 0;color:var(--text-muted)}.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.85);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:1000;padding:1rem}.modal-overlay.active{display:flex}.modal-content{background:var(--card-bg);border:1px solid var(--card-border);border-radius:1rem;width:min(90%,900px);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 25px 50px -12px rgba(0,0,0,.5)}.modal-header{padding:1.5rem;border-bottom:1px solid var(--card-border);display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}.modal-heading{display:flex;gap:1rem;align-items:center}.modal-heading h2{margin:0 0 .25rem;font-size:1.5rem}.modal-company{color:var(--text-muted)}.modal-close{background:none;border:0;color:var(--text-muted);font-size:2rem;cursor:pointer;line-height:1}.modal-close:hover{color:#ef4444}.modal-body{padding:1.5rem;overflow-y:auto}.detail-tags{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.3rem}.modal-section{border-top:1px solid var(--card-border);padding-top:1.25rem;margin-top:1.25rem}.modal-section h3{margin:0 0 .9rem;font-size:1.25rem}.description-full{line-height:1.7;color:var(--text-main)}.description-full p{margin:0 0 1rem}.description-full h4{font-size:1.2rem;margin:1.7rem 0 .65rem}.modal-footer{padding:1.5rem;border-top:1px solid var(--card-border)}.modal-footer .apply-btn{font-size:1.05rem}@media(max-width:680px){.container{padding:1rem}h1{font-size:2rem}.stats{grid-template-columns:1fr}.controls{justify-content:stretch}.controls>*{flex:1}input[type=search]{min-width:0}.job-grid{grid-template-columns:1fr}.modal-content{width:100%}}
  </style>
</head>
<body>
  <main class="container">
    <header><h1>Tech Jobs Dashboard</h1><p class="subtitle">Live insights from your multi-platform scraper</p></header>
    <section class="stats"><div class="stat"><span>Added today</span><strong id="today">—</strong></div><div class="stat"><span>Added yesterday</span><strong id="yesterday">—</strong></div><div class="stat"><span>Selected date</span><strong id="total">—</strong></div></section>
    <form id="filters" class="controls"><input id="date" type="date" name="date"><select id="source" name="source"><option value="">All sources</option></select><input id="q" type="search" name="q" placeholder="Search title, company, or location"><button class="apply-filter">Apply filters</button><a class="button quick-link" id="todayLink">Today</a><a class="button quick-link" id="yesterdayLink">Yesterday</a></form>
    <div id="error" hidden class="error"></div>
    <section id="summarySection" hidden><h2 class="summary-title">Jobs by source and category</h2><p id="summaryNote" class="summary-note"></p><div id="summary" class="breakdown"></div></section>
    <section id="grid" class="job-grid"></section><div id="empty" hidden class="empty">No jobs match your filters.</div>
    <nav id="pagination" hidden class="pagination"><span id="pageInfo"></span><span><a class="button" id="prev">Previous</a> <a class="button" id="next">Next</a></span></nav>
  </main>
  <div id="modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content"><div class="modal-header"><div id="modalHead"></div><button id="close" class="modal-close" aria-label="Close">×</button></div><div class="modal-body"><div id="modalTags" class="detail-tags"></div><section id="requirementsSection" class="modal-section" hidden><h3>Key Skills / Requirements:</h3><div id="requirements" class="detail-tags"></div></section><section class="modal-section"><h3>Full job description</h3><div id="description" class="description-full"></div></section></div><div class="modal-footer"><a id="apply" class="apply-btn" target="_blank" rel="noopener">Apply Now</a></div></div>
  </div>
  <script>
    const state=new URLSearchParams(location.search),$=id=>document.getElementById(id);let payload;
    const escape=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const htmlText=v=>{const e=document.createElement('div');e.innerHTML=v||'';return e.innerText||e.textContent||''};
    const skillList=v=>{if(Array.isArray(v))return v.filter(Boolean);if(typeof v==='string'){try{const x=JSON.parse(v);return Array.isArray(x)?x:[v]}catch{return[v]}}return[]};
    const validUrl=v=>{try{const u=new URL(v);return['http:','https:'].includes(u.protocol)?u.href:''}catch{return''}};
    const tag=(v,type='')=>'<span class="tag '+type+'">'+escape(v)+'</span>';
    const logo=j=>{const url=validUrl(j.companyLogo),letter=escape((j.companyName||'?')[0].toUpperCase());return '<div class="company-logo">'+(url?'<img src="'+escape(url)+'" alt="'+escape(j.companyName||'Company')+' logo" onerror="this.outerHTML=\'<span class=fallback>?</span>\'">':'<span class="fallback">'+letter+'</span>')+'</div>'};
    const description=v=>htmlText(v).replace(/\n\s*\n\s*\n+/g,'\n\n').trim()||'No description available.';
    const preview=v=>{const text=description(v).replace(/\s+/g,' ');return text.length>260?text.slice(0,257).trimEnd()+'…':text};
    function renderDescription(value){const target=$('description'),heads=['Overview','Primary Responsibilities','Responsibilities','Required Qualifications','Preferred Qualifications','Qualifications','Requirements','Education','Benefits','What You Will Do',"What You'll Do"];const text=description(value).replace(/\n?(Overview|Primary Responsibilities|Responsibilities|Required Qualifications|Preferred Qualifications|Qualifications|Requirements|Education|Benefits|What You Will Do|What You'll Do)\n?/g,'\n\n$1\n');target.replaceChildren();for(const section of text.split(/\n\s*\n+/)){const lines=section.split(/\n+/).map(x=>x.trim()).filter(Boolean);if(!lines.length)continue;const heading=lines[0].replace(/:$/,'');if(heads.includes(heading)){const h=document.createElement('h4');h.textContent=heading;target.append(h);lines.shift()}const p=document.createElement('p');p.textContent=lines.join(' ');if(p.textContent)target.append(p)}}
    function openModal(j){$('modalHead').innerHTML='<div class="modal-heading">'+logo(j)+'<div><h2 id="modalTitle">'+escape(j.jobTitle||'Untitled job')+'</h2><div class="modal-company">'+escape(j.companyName)+' • '+escape(j.jobLocation||j.companyLocation||'Remote')+'</div></div></div>';const tags=[j.yearOfExperience&&tag('⏱️ '+j.yearOfExperience,'salary'),j.salary&&tag('💰 '+j.salary,'salary'),j.jobSource&&tag(j.jobSource,'source'),j.category&&tag(j.category),j.jobType&&tag(j.jobType),j.jobPostTime&&tag('📅 '+new Date(j.jobPostTime).toLocaleDateString('en-IN')),j.jobId&&tag('Job ID: '+j.jobId)].filter(Boolean);$('modalTags').innerHTML=tags.join('');const skills=skillList(j.skills);$('requirements').innerHTML=skills.map(x=>tag('✨ '+x,'skill')).join('');$('requirementsSection').hidden=!skills.length;renderDescription(j.jobDescription);const url=validUrl(j.jobUrl);$('apply').href=url||'#';$('apply').hidden=!url;$('modal').classList.add('active');document.body.classList.add('modal-open')}
    const closeModal=()=>{$('modal').classList.remove('active');document.body.classList.remove('modal-open')};
    const navigate=(page=1)=>{const p=new URLSearchParams(new FormData($('filters')));if(page>1)p.set('page',page);location.search=p};
    async function load(){try{const response=await fetch('/api/jobs?'+state);payload=await response.json();if(!response.ok)throw Error(payload.error);$('date').value=payload.date;$('q').value=state.get('q')||'';$('today').textContent=payload.todayCount;$('yesterday').textContent=payload.yesterdayCount;$('total').textContent=payload.total;$('todayLink').href='?date='+payload.today;$('yesterdayLink').href='?date='+payload.yesterday;const source=$('source');source.innerHTML='<option value="">All sources</option>'+payload.sources.map(s=>'<option '+(s===state.get('source')?'selected':'')+'>'+escape(s)+'</option>').join('');
      $('grid').innerHTML=payload.jobs.map((j,i)=>{const skills=skillList(j.skills),tags=[j.jobSource&&tag(j.jobSource,'source'),j.jobLocation&&tag('📍 '+j.jobLocation),j.jobType&&tag('🏢 '+j.jobType),j.yearOfExperience&&tag('⏱️ '+j.yearOfExperience),j.salary&&tag('💰 '+j.salary,'salary'),...skills.slice(0,3).map(s=>tag('✨ '+s,'skill'))].filter(Boolean).join('');return '<article class="job-card" data-index="'+i+'" tabindex="0"><div class="job-header">'+logo(j)+'<div class="job-title-wrapper"><h2 class="job-title">'+escape(j.jobTitle||'Untitled job')+'</h2><p class="company-name">'+escape(j.companyName)+'</p></div></div><div class="meta-tags">'+tags+'</div><p class="job-details">'+escape(preview(j.jobDescription))+'</p><button class="apply-btn">View Job</button></article>'}).join('');
      $('grid').querySelectorAll('.job-card').forEach(card=>{const open=()=>openModal(payload.jobs[Number(card.dataset.index)]);card.onclick=open;card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}});$('empty').hidden=payload.jobs.length>0;
      $('summary').innerHTML=payload.breakdown.map(x=>'<div class="breakdown-card"><span>'+escape(x.source)+'</span><strong>'+escape(x.category)+'</strong><b>'+x.count+' job'+(x.count==1?'':'s')+'</b></div>').join('');$('summarySection').hidden=!payload.breakdown.length;$('summaryNote').textContent='Complete breakdown for '+payload.date+(state.get('source')?' · '+state.get('source')+' only':'')+'.';
      $('pageInfo').textContent='Page '+payload.page+' · '+payload.total+' jobs';$('pagination').hidden=!payload.jobs.length;$('prev').hidden=payload.page<=1;$('next').hidden=payload.page*payload.pageSize>=payload.total;$('prev').onclick=e=>{e.preventDefault();navigate(payload.page-1)};$('next').onclick=e=>{e.preventDefault();navigate(payload.page+1)}}catch(error){$('error').hidden=false;$('error').textContent=error.message||'Unable to load jobs.'}}
    $('filters').onsubmit=e=>{e.preventDefault();navigate()};$('close').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.onkeydown=e=>{if(e.key==='Escape')closeModal()};load();
  </script>
</body></html>
