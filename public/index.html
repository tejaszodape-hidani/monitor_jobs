<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Monitor</title><style>
:root{color-scheme:dark;--bg:#0d1423;--panel:#172033;--line:#2a3955;--muted:#9babc4;--accent:#62d6a2;--blue:#78adff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,#152d54 0,transparent 32%),var(--bg);color:#edf3ff;font:14px/1.45 Inter,system-ui,sans-serif}body.modal-open{overflow:hidden}main{max-width:1480px;margin:auto;padding:32px 24px}h1{margin:0;font-size:28px}.sub{color:var(--muted);margin:5px 0 25px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:22px}.stat,.summary-card,.job-card{background:rgba(23,32,51,.94);border:1px solid var(--line);border-radius:12px}.stat{padding:18px}.stat span,.summary-card span{color:var(--muted);display:block}.stat strong{font-size:30px;color:var(--accent);display:block}form{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}input,select,button,a.button{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);color:inherit;font:inherit}input[type=search]{min-width:260px}button{background:#276749;border-color:#31865d;cursor:pointer}a.button{text-decoration:none}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:10px 0 25px}.summary-card{padding:13px}.summary-card strong{display:block;margin:3px 0 7px}.summary-card b{color:var(--accent)}h2{font-size:18px;margin:0 0 4px}.job-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}.job-card{padding:18px;display:flex;flex-direction:column;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s}.job-card:hover{transform:translateY(-3px);border-color:#4779c5;box-shadow:0 12px 24px #0004}.job-header{display:flex;gap:12px;align-items:flex-start}.logo,.fallback{height:48px;width:48px;border-radius:10px;object-fit:contain;background:#fff;border:1px solid var(--line);padding:4px;flex:none}.fallback{display:grid;place-items:center;background:#263854;color:#c5d9fb;font-weight:700;padding:0}.job-title{font-size:17px;font-weight:700;line-height:1.25;margin:0}.company{color:var(--muted);margin:3px 0 0}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 12px}.tag{background:#263854;color:#c5d9fb;border-radius:999px;padding:3px 7px;font-size:12px}.tag.source{background:#1a365e;color:#a8ccff}.tag.salary{background:#17483b;color:#8cf0bf}.description{color:var(--muted);margin:0 0 16px;white-space:pre-wrap;flex:1}.view{border:0;border-radius:8px;background:#276749;color:white;padding:10px;font-weight:650;cursor:pointer}.error,.empty{padding:18px;border-radius:9px}.error{background:#4b1f2b;border:1px solid #903b50}.empty{background:var(--panel);color:var(--muted);text-align:center}.pagination{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:#070c16d9;backdrop-filter:blur(5px);z-index:5}.modal.active{display:flex}.modal-box{background:#172033;border:1px solid var(--line);border-radius:14px;max-width:820px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 25px 50px #0009}.modal-head{padding:20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px}.modal-title{display:flex;gap:12px}.modal-title h2{font-size:21px;margin:0}.close{background:transparent;border:0;color:var(--muted);font-size:28px;line-height:1;cursor:pointer}.modal-body{padding:20px;overflow:auto}.detail-grid{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.description-full{white-space:pre-wrap;color:#d8e1f2;line-height:1.65}.modal-foot{padding:16px 20px;border-top:1px solid var(--line)}.apply{display:block;text-align:center;background:#276749;color:white;border-radius:8px;padding:11px;text-decoration:none;font-weight:700}@media(max-width:680px){main{padding:20px 14px}.stats{grid-template-columns:1fr}input[type=search]{min-width:0;flex:1}.job-grid{grid-template-columns:1fr}}
</style></head><body><main>
<h1>Job ingestion monitor</h1><p class="sub">Jobs grouped by <code>createdAt</code> · Asia/Kolkata</p>
<section class="stats"><div class="stat"><span>Added today</span><strong id="today">—</strong></div><div class="stat"><span>Added yesterday</span><strong id="yesterday">—</strong></div><div class="stat"><span>Showing for selected date</span><strong id="total">—</strong></div></section>
<form id="filters"><input id="date" type="date" name="date"><select id="source" name="source"><option value="">All sources</option></select><input id="q" type="search" name="q" placeholder="Search title, company, or location"><button>Apply</button><a class="button" id="todayLink">Today</a><a class="button" id="yesterdayLink">Yesterday</a></form>
<div id="error" hidden class="error"></div><section id="summarySection" hidden><h2>Jobs by source and category</h2><p id="summarySub" class="sub"></p><div id="summary" class="summary"></div></section><div id="grid" class="job-grid"></div><div id="empty" hidden class="empty">No jobs found.</div><nav id="pagination" hidden class="pagination"><span id="pageInfo"></span><span><a class="button" id="prev">Previous</a> <a class="button" id="next">Next</a></span></nav>
</main>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalHeading"><div class="modal-box"><div class="modal-head"><div id="modalTitle"></div><button class="close" id="close" aria-label="Close">×</button></div><div class="modal-body"><div id="modalMeta" class="detail-grid"></div><h3>Job description</h3><div id="modalDescription" class="description-full"></div></div><div class="modal-foot"><a id="apply" class="apply" target="_blank" rel="noopener">View job</a></div></div></div>
<script>
const state=new URLSearchParams(location.search),$=id=>document.getElementById(id);let payload;
const escape=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const textFromHtml=value=>{const el=document.createElement('div');el.innerHTML=value||'';return el.textContent||el.innerText||''};
const skills=v=>Array.isArray(v)?v:(typeof v==='string'?(()=>{try{return JSON.parse(v)}catch{return v}})():[]);
const listSkills=v=>Array.isArray(skills(v))?skills(v).filter(Boolean):[];
const safeUrl=value=>{try{const u=new URL(value);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return''}};
const tag=(value,kind='')=>'<span class="tag '+kind+'">'+escape(value)+'</span>';
function logo(job){const initial=escape((job.companyName||'?')[0].toUpperCase()),url=safeUrl(job.companyLogo);return url?'<img class="logo" src="'+escape(url)+'" alt="'+escape(job.companyName||'Company')+' logo" onerror="this.outerHTML=\'<span class=fallback>?</span>\'">':'<span class="fallback">'+initial+'</span>'}
function preview(value){return textFromHtml(value).replace(/\s+/g,' ').trim()||'No description available.'}
function navigate(page=1){const p=new URLSearchParams(new FormData($('filters')));if(page>1)p.set('page',page);location.search=p}
function openModal(job){$('modalTitle').innerHTML='<div class="modal-title">'+logo(job)+'<div><h2 id="modalHeading">'+escape(job.jobTitle||'Untitled job')+'</h2><div class="company">'+escape(job.companyName)+' · '+escape(job.jobLocation||job.companyLocation||'Location not specified')+'</div></div></div>';
 const tags=[job.jobSource&&tag(job.jobSource,'source'),job.category&&tag(job.category),job.jobType&&tag(job.jobType),job.yearOfExperience&&tag(job.yearOfExperience),job.salary&&tag(job.salary,'salary'),...listSkills(job.skills).map(x=>tag(x))].filter(Boolean);$('modalMeta').innerHTML=tags.join('');$('modalDescription').textContent=preview(job.jobDescription);const href=safeUrl(job.jobUrl);$('apply').href=href||'#';$('apply').hidden=!href;$('modal').classList.add('active');document.body.classList.add('modal-open')}
function closeModal(){$('modal').classList.remove('active');document.body.classList.remove('modal-open')}
async function load(){try{const response=await fetch('/api/jobs?'+state);payload=await response.json();if(!response.ok)throw Error(payload.error);$('date').value=payload.date;$('q').value=state.get('q')||'';$('today').textContent=payload.todayCount;$('yesterday').textContent=payload.yesterdayCount;$('total').textContent=payload.total;
 const select=$('source');select.innerHTML='<option value="">All sources</option>'+payload.sources.map(x=>'<option '+(x===state.get('source')?'selected':'')+'>'+escape(x)+'</option>').join('');$('todayLink').href='?date='+payload.today;$('yesterdayLink').href='?date='+payload.yesterday;
 $('grid').innerHTML=payload.jobs.map((job,index)=>{const tags=[job.jobSource&&tag(job.jobSource,'source'),job.category&&tag(job.category),job.jobLocation&&tag('📍 '+job.jobLocation),job.jobType&&tag(job.jobType),job.salary&&tag('💰 '+job.salary,'salary'),...listSkills(job.skills).slice(0,3).map(x=>tag(x))].filter(Boolean).join('');return '<article class="job-card" data-job="'+index+'" tabindex="0"><div class="job-header">'+logo(job)+'<div><h2 class="job-title">'+escape(job.jobTitle||'Untitled job')+'</h2><p class="company">'+escape(job.companyName)+'</p></div></div><div class="tags">'+tags+'</div><p class="description">'+escape(preview(job.jobDescription))+'</p><button class="view" type="button">View details</button></article>'}).join('');
 $('grid').querySelectorAll('.job-card').forEach(card=>{const show=()=>openModal(payload.jobs[Number(card.dataset.job)]);card.onclick=show;card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show()}}});$('empty').hidden=payload.jobs.length>0;$('summary').innerHTML=payload.breakdown.map(x=>'<div class="summary-card"><span>'+escape(x.source)+'</span><strong>'+escape(x.category)+'</strong><b>'+x.count+' job'+(x.count==1?'':'s')+'</b></div>').join('');$('summarySection').hidden=!payload.breakdown.length;$('summarySub').textContent='Complete breakdown for '+payload.date+(state.get('source')?' · '+state.get('source')+' only':'')+'.';
 $('pageInfo').textContent='Page '+payload.page+' · '+payload.total+' jobs';$('pagination').hidden=!payload.jobs.length;$('prev').hidden=payload.page<=1;$('next').hidden=payload.page*payload.pageSize>=payload.total;$('prev').onclick=e=>{e.preventDefault();navigate(payload.page-1)};$('next').onclick=e=>{e.preventDefault();navigate(payload.page+1)}}catch(error){$('error').hidden=false;$('error').textContent=error.message||'Unable to load jobs.'}}
$('filters').onsubmit=e=>{e.preventDefault();navigate()};$('close').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.onkeydown=e=>{if(e.key==='Escape')closeModal()};load();
</script></body></html>
