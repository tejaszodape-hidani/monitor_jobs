<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Monitor</title><style>
:root{color-scheme:dark;--panel:#172033;--line:#2a3955;--muted:#9babc4;--accent:#62d6a2}*{box-sizing:border-box}body{margin:0;background:#0d1423;color:#edf3ff;font:14px/1.45 Inter,system-ui,sans-serif}main{max-width:1480px;margin:auto;padding:32px 24px}h1{margin:0;font-size:28px}.sub{color:var(--muted);margin:5px 0 25px}.stats,.breakdown{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:22px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.stat span,.card span{color:var(--muted);display:block}.stat strong{font-size:30px;color:var(--accent);display:block}.card strong{display:block;margin:4px 0}.card b{color:var(--accent)}form{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}input,select,button,a.button{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);color:inherit;font:inherit}input[type=search]{min-width:260px}button{background:#276749;border-color:#31865d;cursor:pointer}a.button{text-decoration:none}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;min-width:1180px;border-collapse:collapse;background:var(--panel)}th,td{text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#1c2940;color:var(--muted)}.logo,.fallback{width:38px;height:38px;border-radius:9px;object-fit:contain;background:#fff;border:1px solid var(--line);padding:3px}.fallback{display:grid;place-items:center;background:#263854;color:#c5d9fb;font-weight:700;padding:0}.tag{background:#263854;color:#c5d9fb;border-radius:99px;padding:3px 7px;font-size:12px}.muted{color:var(--muted);font-size:12px}.error,.empty{background:#4b1f2b;border:1px solid #903b50;padding:16px;border-radius:9px}.empty{background:var(--panel);border-color:var(--line);text-align:center;color:var(--muted)}.pagination{display:flex;justify-content:space-between;align-items:center;margin-top:16px}@media(max-width:680px){main{padding:20px 14px}.stats{grid-template-columns:1fr}.breakdown{grid-template-columns:1fr}input[type=search]{min-width:0;flex:1}}
</style></head><body><main>
<h1>Job ingestion monitor</h1><p class="sub">Jobs grouped by <code>createdAt</code> · Asia/Kolkata</p>
<section class="stats"><div class="stat"><span>Added today</span><strong id="today">—</strong></div><div class="stat"><span>Added yesterday</span><strong id="yesterday">—</strong></div><div class="stat"><span>Showing for selected date</span><strong id="total">—</strong></div></section>
<form id="filters"><input id="date" type="date" name="date"><select id="source" name="source"><option value="">All sources</option></select><input id="q" type="search" name="q" placeholder="Search title, company, or location"><button>Apply</button><a class="button" id="todayLink">Today</a><a class="button" id="yesterdayLink">Yesterday</a></form>
<div id="error" hidden class="error"></div><section id="breakdownSection" hidden><h2>Jobs by source and category</h2><p id="breakdownSub" class="sub"></p><div id="breakdown" class="breakdown"></div></section>
<div class="table-wrap"><table><thead><tr><th>Added</th><th>Logo</th><th>Job</th><th>Company</th><th>Location</th><th>Type</th><th>Skills</th><th>Source</th><th>Category</th></tr></thead><tbody id="jobs"></tbody></table><div id="empty" hidden class="empty">No jobs found.</div></div><nav id="pagination" hidden class="pagination"><span id="pageInfo"></span><span><a class="button" id="prev">Previous</a> <a class="button" id="next">Next</a></span></nav>
</main><script>
const state=new URLSearchParams(location.search); let payload;
const $=id=>document.getElementById(id); const escape=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateText=v=>v?new Date(v).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'—'; const skills=v=>Array.isArray(v)?v.join(', '):(v||'—');
function navigate(page=1){const p=new URLSearchParams(new FormData($('filters')));if(page>1)p.set('page',page);location.search=p}
async function load(){try{const response=await fetch('/api/jobs?'+state);payload=await response.json();if(!response.ok)throw Error(payload.error);$('date').value=payload.date;$('q').value=state.get('q')||'';$('today').textContent=payload.todayCount;$('yesterday').textContent=payload.yesterdayCount;$('total').textContent=payload.total;
 const source=$('source');source.innerHTML='<option value="">All sources</option>'+payload.sources.map(x=>`<option ${x===state.get('source')?'selected':''}>${escape(x)}</option>`).join('');$('todayLink').href='?date='+payload.today;$('yesterdayLink').href='?date='+payload.yesterday;
 $('jobs').innerHTML=payload.jobs.map(j=>{const initial=escape((j.companyName||'?')[0].toUpperCase());const logo=j.companyLogo?`<img class="logo" src="${escape(j.companyLogo)}" alt="${escape(j.companyName||'Company')} logo" onerror="this.outerHTML='<span class=\'fallback\'>?</span>'">`:`<span class="fallback">${initial}</span>`;return `<tr><td>${dateText(j.createdAt)}</td><td>${logo}</td><td><strong>${j.jobUrl?`<a target="_blank" rel="noopener" href="${escape(j.jobUrl)}">${escape(j.jobTitle||'Untitled job')}</a>`:escape(j.jobTitle||'Untitled job')}</strong><br><span class="muted">${escape(j.jobId||'No job ID')}</span></td><td>${escape(j.companyName)}</td><td>${escape(j.jobLocation||j.companyLocation)}</td><td><span class="tag">${escape(j.jobType)}</span></td><td class="muted">${escape(skills(j.skills))}</td><td>${escape(j.jobSource)}</td><td><span class="tag">${escape(j.category||'General')}</span></td></tr>`}).join('');$('empty').hidden=payload.jobs.length>0;
 $('breakdown').innerHTML=payload.breakdown.map(x=>`<div class="card"><span>${escape(x.source)}</span><strong>${escape(x.category)}</strong><b>${x.count} job${x.count==1?'':'s'}</b></div>`).join('');$('breakdownSection').hidden=!payload.breakdown.length;$('breakdownSub').textContent=`Complete breakdown for ${payload.date}${state.get('source')?' · '+state.get('source')+' only':''}.`;
 $('pageInfo').textContent=`Page ${payload.page} · ${payload.total} jobs`;$('pagination').hidden=!payload.jobs.length;$('prev').hidden=payload.page<=1;$('next').hidden=payload.page*payload.pageSize>=payload.total;$('prev').onclick=e=>{e.preventDefault();navigate(payload.page-1)};$('next').onclick=e=>{e.preventDefault();navigate(payload.page+1)};
}catch(error){$('error').hidden=false;$('error').textContent=error.message||'Unable to load jobs.'}}
$('filters').onsubmit=e=>{e.preventDefault();navigate()};load();
</script></body></html>
